<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify</title>
</head>
<body>
<form method="post">
  {% csrf_token %}

  <input type="text" value="{{ phone }}" readonly>
  <input type="hidden" name="phone" value="{{ phone }}">

  {% if error %}
    <p style="color:red;">{{ error }}</p>
  {% endif %}

  <input type="text" name="code">
  <button type="submit">Verify</button>

</form>
</body>
</html>
